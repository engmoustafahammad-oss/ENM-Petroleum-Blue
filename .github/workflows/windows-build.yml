name: ENM Windows Build


on:


  push:
  
    branches: [main]
    
  workflow_dispatch:
  
jobs:


  test-and-package:
  
    runs-on: windows-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
      
        with:
        
          python-version: '3.11'
          
      - name: Extract source bundle
      
        shell: pwsh
        
        run: Expand-Archive -Path ENM_Source_v0.3.zip -DestinationPath enm-src
        
      - name: Install dependencies
      
        shell: pwsh
        
        working-directory: enm-src
        
        run: python -m pip install --upgrade pip; pip install -r requirements.txt; pip install pyinstaller pytest
        
      - name: Run tests
      
        shell: pwsh
        
        working-directory: enm-src
        
        run: python -m pytest -q
        
      - name: Build application
      
        shell: pwsh
        
        working-directory: enm-src
        
        run: pyinstaller --noconfirm --clean tools/ENM.spec
        
      - name: Build installer
      
        shell: pwsh
        
        working-directory: enm-src
        
        run: |
        
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $iscc) { throw 'Inno Setup compiler not found on runner' }
          
