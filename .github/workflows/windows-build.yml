name: ENM Windows Build

on:

  push:
  
    branches: [main]
    
  workflow_dispatch:
  
jobs:

  test-and-package:
  
    runs-on: windows-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
      
        with:
        
          python-version: '3.11'
          
      - name: Install dependencies
      
        shell: pwsh
        
        run: python -m pip install --upgrade pip; pip install -r requirements.txt; pip install pyinstaller pytest
        
      - name: Run tests
      
        shell: pwsh
        
        run: python -m pytest -q
        
      - name: Build application
      
        shell: pwsh
        
        run: pyinstaller --noconfirm --clean tools/ENM.spec
        
      - name: Install Inno Setup
      
        shell: pwsh
        
        run: choco install innosetup -y --no-progress
        
      - name: Build installer
      
        shell: pwsh
        
        run: |
        
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $iscc) { throw 'Inno Setup compiler not found on runner' }
          
          & $iscc.FullName tools/ENM.iss
          
          if (-not (Test-Path release/ENM_Setup_v*.exe)) { throw 'Installer was not produced' }
          
      - name: Upload Windows installer
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: ENM-Windows-Installer
          
          path: |
          
            release/*.exe
            
            dist/**
            
          if-no-files-found: error
          
          retention-days: 30




































